<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
<defs>
  <style>
    @keyframes scanX { 0%{transform:translateX(-900px)} 100%{transform:translateX(1800px)} }
    @keyframes scanX2 { 0%{transform:translateX(-900px)} 100%{transform:translateX(1800px)} }
    @keyframes pulseEye { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes pulseEye2 { 0%,100%{opacity:0.7} 40%{opacity:1} 70%{opacity:0.2} }
    @keyframes floatY { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-6px)} }
    @keyframes floatY2 { 0%,100%{transform:translateY(-3px)} 50%{transform:translateY(3px)} }
    @keyframes thruster { 0%,100%{opacity:0.9;transform:scaleY(1)} 50%{opacity:0.4;transform:scaleY(0.6)} }
    @keyframes beamFire { 0%{opacity:0;transform:scaleX(0)} 10%{opacity:1;transform:scaleX(1)} 80%{opacity:0.8} 100%{opacity:0;transform:scaleX(2.5) translateX(60px)} }
    @keyframes starBlink { 0%,100%{opacity:0.2} 50%{opacity:1} }
    @keyframes gridFade { 0%,100%{opacity:0.04} 50%{opacity:0.1} }
    @keyframes textGlow { 0%,100%{opacity:0.6} 50%{opacity:1} }
    @keyframes particleDrift { 0%{transform:translate(0,0);opacity:0} 20%{opacity:1} 100%{transform:translate(-120px,-80px);opacity:0} }
    @keyframes particleDrift2 { 0%{transform:translate(0,0);opacity:0} 20%{opacity:0.8} 100%{transform:translate(100px,-60px);opacity:0} }
    @keyframes shieldPulse { 0%,100%{opacity:0;r:28} 30%{opacity:0.3;r:34} 60%{opacity:0.1;r:40} }
  </style>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
